name: CI/CD

# No develop branch: personal branches open PRs straight to main (#4).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Throwaway Postgres for the integration tests. TEST-ONLY credentials,
    # matching the default in server/tests/test-config.js; never a real secret.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: imizamo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/imizamo_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # One install for both workspaces (the only lockfile is at the root).
      - name: Install dependencies
        run: npm ci

      - name: Lint client
        working-directory: client
        run: npx oxlint

      - name: Run server tests (unit + integration against Postgres)
        run: npm run test:server

      - name: Run client tests
        run: npm run test:client

      - name: Build client
        working-directory: client
        run: npm run build

  e2e:
    name: End-to-end tests (Playwright)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Same throwaway Postgres as the test job. TEST-ONLY credentials.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: imizamo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/imizamo_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Migrates and seeds the database, starts the API and the client, then
      # runs the browser tests (see e2e/README.md).
      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  deploy:
    name: Deploy to Azure
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # One install for both workspaces (the only lockfile is at the root).
      - name: Install dependencies
        run: npm ci

      # Builds deploy/: the React app, the API and production dependencies
      # only (~6 MB). See scripts/build-deploy.mjs.
      - name: Build deploy package
        run: npm run build:deploy

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          # Must match the Web App the publish profile secret belongs to.
          app-name: 'Imizamo-Yethu-Aftercare-WebApp'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy